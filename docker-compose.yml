x-web: &web
  build: .
  environment:
    POSTGRES_HOST: db
    DJANGO_DEBUG: "0"
  
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: journey
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey"]
      interval: 2s
      retries: 15


  web1:
    <<: *web
    ports:
      - "8001:8000" 

  web2:
    <<: *web


  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web1
      - web2

volumes:
  pgdata: